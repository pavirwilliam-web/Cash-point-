<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des entrées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f6f4ec;
    --grid: #c9d3e0;
    --ink: #1e2530;
    --ink-soft: #55606f;
    --green: #3f7d5c;
    --green-deep: #2b5940;
    --rust: #c1502e;
    --line: #2b3a67;
    --card: #fffdf6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 28px),
      var(--paper);
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 60px;
  }
  h1{
    font-family:'Kalam', cursive;
    font-size:clamp(28px, 5vw, 40px);
    margin:0 0 4px;
    color:var(--line);
    transform:rotate(-0.6deg);
  }
  .subtitle{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 28px;
    letter-spacing:0.02em;
  }
  .wrap{
    max-width:980px;
    margin:0 auto;
  }
  .layout{
    display:grid;
    grid-template-columns:180px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:640px){
    .layout{grid-template-columns:1fr;}
    .gauge-col{order:1;}
    .panels{order:2;}
  }
  .zig{
    height:10px;
    background-image:
      linear-gradient(135deg, var(--card) 25%, transparent 25%) ,
      linear-gradient(225deg, var(--card) 25%, transparent 25%);
    background-position:0 0;
    background-size:12px 12px;
    background-repeat:repeat-x;
  }
  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:4px;
    box-shadow:3px 3px 0 rgba(43,58,103,0.12);
  }
  .card-body{ padding:18px 20px; }
  .card-title{
    font-family:'Kalam', cursive;
    font-size:20px;
    color:var(--line);
    margin:0 0 14px;
  }

  /* --- Gauge --- */
  .gauge-col{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .gauge-target{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15px;
    color:var(--line);
    margin-bottom:6px;
    text-align:center;
  }
  .gauge-target span{
    display:block;
    font-size:10px;
    font-weight:400;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .gauge-shell{
    position:relative;
    width:74px;
    height:400px;
    border:2px solid var(--line);
    border-radius:37px;
    background:
      repeating-linear-gradient(0deg, rgba(43,58,103,0.08) 0 1px, transparent 1px 20px),
      #fff;
    overflow:hidden;
  }
  .gauge-fill{
    position:absolute;
    left:0; right:0; bottom:0;
    height:0%;
    background:linear-gradient(180deg, #58a97c, var(--green-deep));
    transition:height 0.5s cubic-bezier(.4,0,.2,1);
  }
  .gauge-fill::before{
    content:"";
    position:absolute;
    top:-6px; left:0; right:0; height:12px;
    background:
      linear-gradient(135deg, var(--green) 25%, transparent 25%),
      linear-gradient(225deg, var(--green) 25%, transparent 25%);
    background-position:0 0;
    background-size:10px 10px;
    background-repeat:repeat-x;
  }
  .gauge-marker{
    position:absolute;
    left:100%;
    bottom:0%;
    transform:translateY(50%);
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
    transition:bottom 0.5s cubic-bezier(.4,0,.2,1);
  }
  .gauge-marker svg{ flex:none; }
  .gauge-marker-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    color:var(--rust);
    background:var(--paper);
    padding:1px 4px;
    border-radius:2px;
  }
  .gauge-pct{
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }

  /* --- Manual panel --- */
  .manual-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:6px;
  }
  .amt-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid var(--line);
    background:var(--card);
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    color:var(--line);
    transition:transform 0.1s;
  }
  .amt-btn:active{ transform:scale(0.92); }
  .amt-btn.plus{ color:var(--green-deep); border-color:var(--green-deep); }
  .amt-btn.minus{ color:var(--rust); border-color:var(--rust); }
  .amt-display{
    font-family:'IBM Plex Mono', monospace;
    font-size:32px;
    font-weight:600;
    min-width:110px;
    text-align:center;
    cursor:text;
    border-bottom:1.5px dashed transparent;
    padding:2px 4px;
    border-radius:3px;
  }
  .amt-display:hover{ border-bottom-color:var(--ink-soft); }
  .amt-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:32px;
    font-weight:600;
    min-width:110px;
    max-width:160px;
    text-align:center;
    border:1.5px solid var(--line);
    border-radius:3px;
    padding:1px 4px;
    background:#fff;
    color:var(--ink);
  }
  .amt-input:focus{ outline:none; border-color:var(--green-deep); }
  .manual-hint{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }

  /* --- Forecast panel --- */
  .entry-form{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .entry-form input{
    font-family:'Work Sans', sans-serif;
    border:1.5px solid var(--line);
    border-radius:3px;
    padding:8px 10px;
    background:#fff;
    font-size:14px;
  }
  .entry-form input[name="name"]{ flex:2; min-width:140px; }
  .entry-form input[name="amount"]{ flex:1; min-width:90px; font-family:'IBM Plex Mono', monospace; }
  .entry-form button{
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    border:none;
    border-radius:3px;
    background:var(--line);
    color:#fff;
    padding:8px 16px;
    cursor:pointer;
  }
  .entries{ list-style:none; margin:0; padding:0; }
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px dashed var(--grid);
  }
  .entry:last-child{ border-bottom:none; }
  .entry input[type=checkbox]{
    width:18px; height:18px;
    accent-color:var(--green-deep);
    cursor:pointer;
    flex:none;
  }
  .entry-name{ flex:1; font-size:14px; }
  .entry.received .entry-name{ text-decoration:line-through; color:var(--ink-soft); }
  .entry-amount{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:14px;
    color:var(--green-deep);
  }
  .entry.received .entry-amount{ color:var(--ink-soft); }
  .entry-del{
    background:none; border:none; color:var(--rust);
    font-size:16px; cursor:pointer; flex:none; line-height:1;
    padding:2px 4px;
  }
  .empty-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    padding:8px 0;
  }
  .stats{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:16px;
    padding-top:14px;
    border-top:1.5px solid var(--line);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .stat b{ display:block; font-size:16px; color:var(--line); }
  .reset-btn{
    margin-top:22px;
    background:none;
    border:1px dashed var(--ink-soft);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:5px 10px;
    border-radius:3px;
    cursor:pointer;
  }
  .status{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    min-height:16px;
    text-align:right;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gestion des entrées</h1>
  <p class="subtitle">objectif · argent reçu · prévisions</p>

  <div class="layout">
    <div class="gauge-col">
      <div class="gauge-target" id="targetLabel">0<span>objectif</span></div>
      <div class="gauge-shell">
        <div class="gauge-fill" id="gaugeFill">
          <div class="gauge-marker" id="gaugeMarker" style="bottom:0%;">
            <svg width="16" height="10" viewBox="0 0 16 10"><path d="M0 5 H12 M8 1 L12 5 L8 9" stroke="#c1502e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="gauge-marker-label" id="gaugeMarkerLabel">0</span>
          </div>
        </div>
      </div>
      <div class="gauge-pct" id="gaugePct">0%</div>
    </div>

    <div class="panels">
      <div class="card">
        <div class="zig"></div>
        <div class="card-body">
          <p class="card-title">Argent reçu (ajustement)</p>
          <div class="manual-row">
            <button class="amt-btn minus" id="btnMinus">−</button>
            <div class="amt-display" id="manualDisplay" title="Appuie pour saisir directement">0</div>
            <button class="amt-btn plus" id="btnPlus">+</button>
          </div>
          <p class="manual-hint">+ / − = pas de 100 · appuie sur le montant pour le saisir directement</p>
        </div>
      </div>

      <div class="card" style="margin-top:20px;">
        <div class="zig"></div>
        <div class="card-body">
          <p class="card-title">Prévisions d'entrées</p>
          <form class="entry-form" id="entryForm">
            <input type="text" name="name" placeholder="Nom de l'entrée" required>
            <input type="number" name="amount" placeholder="Montant" min="1" required>
            <button type="submit">Ajouter</button>
          </form>
          <ul class="entries" id="entriesList"></ul>
          <div class="stats">
            <div class="stat"><span id="statTarget">0</span><b id="statTargetK">0</b></div>
            <div class="stat">reçu<b id="statCurrent">0</b></div>
            <div class="stat">reste<b id="statRemain">0</b></div>
          </div>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn">réinitialiser toutes les données</button>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'budget-state';
let state = { manualAmount: 0, entries: [] };

function fmt(n){
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if(abs >= 1000){
    let v = Math.round((abs/1000)*10)/10;
    let s = (v % 1 === 0) ? v.toFixed(0) : v.toFixed(1);
    return sign + s + 'K';
  }
  return sign + String(abs);
}

function receivedSum(){
  return state.entries.filter(e => e.received).reduce((a,e) => a + e.amount, 0);
}
function target(){
  return state.entries.reduce((a,e) => a + e.amount, 0);
}
function current(){
  return state.manualAmount + receivedSum();
}

function uid(){ return Math.random().toString(36).slice(2,10); }

async function save(){
  const statusEl = document.getElementById('status');
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    statusEl.textContent = 'enregistré';
    setTimeout(()=>{ if(statusEl.textContent==='enregistré') statusEl.textContent=''; }, 1200);
  }catch(err){
    statusEl.textContent = 'erreur d\'enregistrement';
    console.error('Storage error:', err);
  }
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        state.manualAmount = parsed.manualAmount || 0;
        state.entries = Array.isArray(parsed.entries) ? parsed.entries : [];
      }
    }
  }catch(err){
    console.log('Aucune donnée existante, démarrage à zéro.', err);
  }
  render();
}

function render(){
  const t = target();
  const c = current();
  const pct = t > 0 ? Math.min(100, (c / t) * 100) : 0;

  document.getElementById('targetLabel').innerHTML = fmt(t) + '<span>objectif</span>';
  document.getElementById('gaugeFill').style.height = pct + '%';
  document.getElementById('gaugeMarker').style.bottom = pct + '%';
  document.getElementById('gaugeMarkerLabel').textContent = fmt(c);
  document.getElementById('gaugePct').textContent = Math.round(pct) + '%';

  const manualDisplayEl = document.getElementById('manualDisplay');
  if(manualDisplayEl) manualDisplayEl.textContent = fmt(state.manualAmount);

  document.getElementById('statTarget').textContent = 'objectif';
  document.getElementById('statTargetK').textContent = fmt(t);
  document.getElementById('statCurrent').textContent = fmt(c);
  document.getElementById('statRemain').textContent = fmt(Math.max(0, t - c));

  const list = document.getElementById('entriesList');
  list.innerHTML = '';
  if(state.entries.length === 0){
    const li = document.createElement('li');
    li.className = 'empty-note';
    li.textContent = 'Aucune prévision pour le moment — ajoute une entrée ci-dessus.';
    list.appendChild(li);
  }else{
    state.entries.forEach(entry => {
      const li = document.createElement('li');
      li.className = 'entry' + (entry.received ? ' received' : '');
      li.innerHTML = `
        <input type="checkbox" ${entry.received ? 'checked' : ''} data-id="${entry.id}" class="chk">
        <span class="entry-name">${escapeHtml(entry.name)}</span>
        <span class="entry-amount">${fmt(entry.amount)}</span>
        <button class="entry-del" data-id="${entry.id}" title="supprimer">✕</button>
      `;
      list.appendChild(li);
    });
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function startEditManual(){
  const display = document.getElementById('manualDisplay');
  if(!display) return; // already editing
  const input = document.createElement('input');
  input.type = 'number';
  input.inputMode = 'numeric';
  input.className = 'amt-input';
  input.id = 'manualInput';
  input.value = state.manualAmount;
  display.replaceWith(input);
  input.focus();
  input.select();

  let cancelled = false;
  const restoreDisplay = () => {
    const freshDisplay = document.createElement('div');
    freshDisplay.className = 'amt-display';
    freshDisplay.id = 'manualDisplay';
    freshDisplay.title = 'Appuie pour saisir directement';
    freshDisplay.addEventListener('click', startEditManual);
    if(input.parentNode) input.replaceWith(freshDisplay);
  };
  const commit = () => {
    if(cancelled) return;
    const val = parseInt(input.value, 10);
    state.manualAmount = isNaN(val) || val < 0 ? state.manualAmount : val;
    restoreDisplay();
    render(); save();
  };
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ input.blur(); }
    if(e.key === 'Escape'){ cancelled = true; restoreDisplay(); render(); }
  });
  input.addEventListener('blur', commit);
}

document.getElementById('manualDisplay').addEventListener('click', startEditManual);

document.getElementById('btnPlus').addEventListener('click', () => {
  state.manualAmount += 100;
  render(); save();
});
document.getElementById('btnMinus').addEventListener('click', () => {
  state.manualAmount = Math.max(0, state.manualAmount - 100);
  render(); save();
});

document.getElementById('entryForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const amount = parseInt(form.amount.value, 10);
  if(!name || !amount || amount <= 0) return;
  state.entries.push({ id: uid(), name, amount, received: false });
  form.reset();
  render(); save();
});

document.getElementById('entriesList').addEventListener('click', (e) => {
  if(e.target.classList.contains('chk')){
    const id = e.target.dataset.id;
    const entry = state.entries.find(x => x.id === id);
    if(entry){ entry.received = e.target.checked; render(); save(); }
  }
  if(e.target.classList.contains('entry-del')){
    const id = e.target.dataset.id;
    state.entries = state.entries.filter(x => x.id !== id);
    render(); save();
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(confirm('Réinitialiser toutes les entrées et le montant reçu ?')){
    state = { manualAmount: 0, entries: [] };
    render(); save();
  }
});

load();
</script>
</body>
</html>
